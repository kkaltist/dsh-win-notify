name: release

# 打 tag（v*）就出一个 Release，把 npm 打好的 tgz 挂上去。
# 这样别人不用自己打包：Releases 里直接下。
#
# 注意两点（上一版就是栽在这儿）：
#   1. npm pack --pack-destination 不会自己建目录，得先 mkdir；
#   2. 别用 windows-latest + PowerShell —— 通配符 `dist/*.tgz` 不会被展开。
# 包体是纯文本（JS + PowerShell 脚本），在 Linux 上打出来一模一样。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pack tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同一个 tag 被重打过（比如重写作者、重新打 tag）时，Release 已经存在：
          # 这时不是失败，而是把附件覆盖上传。
          gh release create "${GITHUB_REF_NAME}" dist/*.tgz \
            --title "DSH 桌面通知 ${GITHUB_REF_NAME}" \
            --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" dist/*.tgz --clobber
